[package]
name = "bh"
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Nikola Jokic <nikola.jokic@bountyhub.org>"]
description = "BountyHub CLI"
repository = "https://github.com/bountyhub-org/bh"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
usage = { package = "usage-rs", version = "6", features = ["completions"] }
ureq = { version = "^3", features = ["json", "rustls", "platform-verifier"] }
serde = { version = "^1", features = ["derive"] }
uuid = "^1"
serde_json = "^1"
percent-encoding = "2.3.1"
thiserror = "2"
zip = "8.6.0"
connectrpc = { version = "0.6.1", features = ["client", "client-tls"] }
buffa = { version = "0.6.0", features = ["json"] }
buffa-types = { version = "0.6.0", features = ["json"] }
http = "1.0.0"
http-body = "1.0.1"
rustls = "0.23"
rustls-native-certs = "0.8.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
async-trait = "0.1"

[dev-dependencies]
uuid = { version = "^1", features = ["v7"] }
mockall = "^0.13"
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
connectrpc-build = "0.6.1"
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
